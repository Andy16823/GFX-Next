    id: GetTransform
    path: ../LibGFX/Graphics/Mesh.cs
    startLine: 128
  assemblies:
  - LibGFX
  namespace: LibGFX.Graphics
  summary: Calculates the local transformation matrix by combining the current scale, rotation, and translation values.
  remarks: >-
    The resulting matrix applies scaling first, then rotation, and finally translation.
        This order affects how objects are transformed in local space. The method does not account for any parent
        transformations; it only reflects the local transform.
  example: []
  syntax:
    content: public Matrix4 GetTransform()
    return:
      type: OpenTK.Mathematics.Matrix4
      description: >-
        A <xref href="OpenTK.Mathematics.Matrix4" data-throw-if-not-resolved="false"></xref> representing the local transformation composed of scale, rotation, and translation,
            applied in that order.
    content.vb: Public Function GetTransform() As Matrix4
  overload: LibGFX.Graphics.Mesh.GetTransform*
