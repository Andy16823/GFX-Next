  assemblies:
  - LibGFX
  namespace: LibGFX.Core
  summary: Provides a context for storing and retrieving key-value pairs during serialization operations.
  remarks: >-
    Use this class to pass additional contextual information between serialization components.
        The context is typically used to share data that may influence how objects are serialized or deserialized. Keys
        are case-sensitive. This class is not thread-safe; synchronize access if used concurrently from multiple
        threads.
  example: []
