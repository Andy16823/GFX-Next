  namespace: LibGFX.Core
  summary: >-
    Retrieves the value associated with the specified key, or returns a default value if the key is not found or

    cannot be cast to the specified type.
  remarks: >-
    If the value associated with the key exists but is not of type T, the default value
        is returned instead of throwing an exception.
  example: []
  syntax:
    content: public T GetValue<T>(string key, T defaultValue = default)
    parameters:
    - id: key
      type: System.String
      description: The key whose associated value is to be retrieved.
    - id: defaultValue
      type: '{T}'
      description: The value to return if the key does not exist or the value cannot be cast to type T.
    typeParameters:
    - id: T
      description: The type of the value to retrieve.
    return:
      type: '{T}'
      description: >-
        The value associated with the specified key, cast to type T, if found and of the correct type; otherwise,
            the specified default value.
