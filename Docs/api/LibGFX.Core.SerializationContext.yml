  assemblies:
  - LibGFX
  namespace: LibGFX.Core
  summary: >-
    Gets a collection of key-value pairs that provide additional contextual information associated with the

    current instance.
  remarks: >-
    Use this property to store or retrieve custom data relevant to the context in which
        the instance is used. The dictionary is initialized and never null, but may be empty if no context data has
        been added.
  example: []
  syntax:
    content: public Dictionary<string, object> ContextData { get; }
    parameters: []
