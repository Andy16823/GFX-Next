  assemblies:
  - LibGFX
  namespace: LibGFX.Graphics.Materials
  summary: >-
    Defines the contract for a material used in rendering operations, including identification, configuration, and

    lifecycle management.
  remarks: >-
    Implementations of this interface represent materials that can be initialized, used, and
        disposed of with a rendering device. The interface also provides a static method for loading a material from an
        external source. Implementers should ensure thread safety if materials are accessed concurrently.
  example: []
  syntax:
    content: 'public interface IMaterial : IGraphicsResource, IIdentifier, ISerialization'
    content.vb: Public Interface IMaterial Inherits IGraphicsResource, IIdentifier, ISerialization
