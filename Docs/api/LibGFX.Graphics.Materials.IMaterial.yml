    id: LoadMaterial
    path: ../LibGFX/Graphics/Materials/IMaterial.cs
    startLine: 45
  assemblies:
  - LibGFX
  namespace: LibGFX.Graphics.Materials
  summary: Creates an IMaterial instance from the specified Assimp material and associated resource directory.
  remarks: >-
    Use this method to convert materials imported via Assimp into the application's
        material representation. The directory parameter should point to the location of any textures or external
        resources referenced by the material.
  example: []
  syntax:
    content: void LoadMaterial(Material asmat, string directory)
    parameters:
    - id: asmat
      type: Assimp.Material
      description: The Assimp.Material object containing material properties to be loaded.
    - id: directory
      type: System.String
      description: >-
        The directory path used to resolve any external resources referenced by the material. Cannot be null or
            empty.
    content.vb: Sub LoadMaterial(asmat As Material, directory As String)
