    path: ../LibGFX/Graphics/PostProcessing/PixelationFX.cs
    startLine: 18
  assemblies:
  - LibGFX
  namespace: LibGFX.Graphics.PostProcessing
  summary: Applies a pixelation post-processing effect to a rendered scene using a configurable pixel size.
  remarks: >-
    PixelationFX is intended for use within a post-processing stack to create a retro or stylized
        visual effect by rendering the scene with blocky, pixelated regions. The effect can be configured by adjusting
        the PixelSize property. This class manages its own render target and shader resources, and should be
        initialized, applied, resized, and disposed in coordination with the rendering pipeline. PixelationFX is not
        thread-safe and should be used from the main rendering thread.
  example: []
  syntax:
    content: 'public class PixelationFX : IPostProcessFilter'
    content.vb: Public Class PixelationFX Implements IPostProcessFilter
