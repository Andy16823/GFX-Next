  assemblies:
  - LibGFX
  namespace: LibGFX.Core
  summary: Releases any CPU resources that are currently allocated by the component.
  remarks: >-
    Call this method when the component no longer needs to perform CPU-intensive
        operations to allow the system to reclaim resources. After calling this method, the component may not be
        able to perform certain operations until resources are reallocated.
