  namespace: LibGFX.Compute
  summary: Represents a compute shader program, including its source code and execution parameters.
  remarks: >-
    Use this class to manage the source and configuration of a compute shader for GPU-based
        parallel processing tasks. The properties provide access to the shader's source code, the number of invocations,
        and the program identifier required for execution within a graphics or compute API.
