  assemblies:
  - LibGFX
  namespace: LibGFX.Physics
  summary: Represents a ray in three-dimensional space, defined by an origin point and a direction vector.
  remarks: >-
    A ray is commonly used in graphics and physics calculations to represent a line with a
        specific starting point and direction, extending infinitely. The direction vector should be normalized to ensure
        consistent behavior in intersection and projection operations.
