  namespace: LibGFX.Assets
  summary: Retrieves an asset of the specified type and name from the asset collection.
  remarks: >-
    If multiple assets exist with the same name but different types, only the asset
        matching the specified type is returned. The method returns <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> if the asset does not
        exist or is not of the requested type.
  example: []
  syntax:
    content: 'public T? Get<T>(string name) where T : class'
    parameters:
    - id: name
      type: System.String
      description: The name of the asset to retrieve. The name is case-sensitive.
    typeParameters:
    - id: T
      description: The type of asset to retrieve. Must be a reference type.
    return:
      type: '{T}'
      description: >-
        The asset of type <code class="typeparamref">T</code> with the specified name, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> if no matching
            asset is found.
    content.vb: Public Function [Get](Of T As Class)(name As String) As T
