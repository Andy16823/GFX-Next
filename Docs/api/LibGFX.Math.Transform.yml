  namespace: LibGFX.Math
  summary: Occurs when the transform has changed.
  remarks: >-
    Subscribe to this event to be notified whenever the associated transform is modified.
        The event provides the updated transform as an argument to the event handler. Handlers are invoked in the
        order in which they were added.
