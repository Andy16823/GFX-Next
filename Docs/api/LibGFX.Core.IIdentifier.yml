  summary: Defines a contract for objects that have a unique identifier and a name.
  remarks: >-
    Implementations of this interface can be used to represent entities that require both a
        human-readable name and a globally unique identifier. This is commonly used for objects that need to be
        referenced or tracked across different systems or contexts.
