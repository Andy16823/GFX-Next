  namespace: LibGFX.Core
  summary: Creates a new Bitmap from a byte array containing pixel data in BGRA format with 32 bits per pixel.
  remarks: >-
    The resulting bitmap is vertically flipped to match the coordinate origin used by
        OpenGL, where the origin is at the bottom-left corner. The input pixel data must be in row-major order, with
        each pixel represented by four bytes (blue, green, red, alpha).
  example: []
  syntax:
    content: public static Bitmap ByteBGRAToBitmap(byte[] pixels, int width, int height)
    parameters:
    - id: pixels
      type: System.Byte[]
      description: >-
        An array of bytes representing the pixel data in BGRA order. The array length must be at least width ×
            height × 4.
    - id: width
      type: System.Int32
      description: The width, in pixels, of the resulting bitmap. Must be greater than 0.
    - id: height
      type: System.Int32
      description: The height, in pixels, of the resulting bitmap. Must be greater than 0.
    return:
      type: System.Drawing.Bitmap
      description: A Bitmap object containing the image represented by the specified BGRA pixel data.
    content.vb: Public Shared Function ByteBGRAToBitmap(pixels As Byte(), width As Integer, height As Integer) As Bitmap
