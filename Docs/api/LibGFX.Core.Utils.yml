      description: The node from which to begin the search. This node and its descendants will be examined.
    - id: name
      type: System.String
      description: The name of the node to search for. The comparison is case-sensitive.
    - id: foundNode
      type: LibGFX.Graphics.Animation3D.SceneNodeData
      description: >-
        When this method returns, contains the first node with the specified name if found; otherwise, a default
            value.
    return:
      type: System.Boolean
      description: true if a node with the specified name is found; otherwise, false.
