    path: ../LibGFX/Core/Utils.cs
    startLine: 40
  assemblies:
  - LibGFX
  namespace: LibGFX.Core
  summary: Creates a new instance of the default asset manager configured with loaders for common asset types.
  remarks: >-
    Use this method to obtain an asset manager that is ready to load standard asset types
        without additional configuration. Custom loaders can be registered with the returned manager if
        needed.
  example: []
  syntax:
    content: public static AssetManager CreateDefaultAssetManager()
    return:
      type: LibGFX.Assets.AssetManager
      description: >-
        An <xref href="LibGFX.Assets.AssetManager" data-throw-if-not-resolved="false"></xref> instance pre-registered with loaders for textures, audio clips, materials,
            cubemaps, sprite materials, skinned mesh models, and static mesh models.
    content.vb: Public Shared Function CreateDefaultAssetManager() As AssetManager
  overload: LibGFX.Core.Utils.CreateDefaultAssetManager*
