    path: ../LibGFX/Core/GameElements/PointLight3DHandle.cs
    startLine: 60
  assemblies:
  - LibGFX
  namespace: LibGFX.Core.GameElements
  summary: >-
    Initializes a new instance of the PointLight3DHandle class with the specified name, position, color, range,

    and intensity.
  remarks: >-
    If no transform is assigned, a new Transform is created and initialized with the
        specified position. The transform's Changed event is automatically subscribed to for internal
        updates.
        This class adds the point light to the scene and manages its lifecycle, including disposal of resources
  example: []
  syntax:
    content: public PointLight3DHandle(string name, Vector3 position, Vector4 color, float range = 10, float intesity = 1)
    parameters:
    - id: name
      type: System.String
      description: The unique name used to identify the point light instance.
    - id: position
      type: OpenTK.Mathematics.Vector3
      description: The position of the point light in 3D space.
    - id: color
      type: OpenTK.Mathematics.Vector4
      description: The color of the point light, including its alpha component.
    - id: range
      type: System.Single
      description: The effective range of the point light, in world units. Must be greater than zero.
    - id: intesity
      type: System.Single
      description: The intensity of the point light. Must be a non-negative value.
    content.vb: Public Sub New(name As String, position As Vector3, color As Vector4, range As Single = 10, intesity As Single = 1)
