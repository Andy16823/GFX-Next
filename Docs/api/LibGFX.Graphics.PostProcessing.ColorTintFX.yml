  assemblies:
  - LibGFX
  namespace: LibGFX.Graphics.PostProcessing
  summary: Applies a color tint effect as a post-processing filter to a rendered scene.
  remarks: >-
    The ColorTintFX class is intended for use within a post-processing stack to overlay a
        configurable color tint on the output image. It manages its own render target and shader resources, and should
        be initialized and disposed of using the corresponding methods. This class is not thread-safe.
  example: []
  syntax:
    content: 'public class ColorTintFX : IPostProcessFilter'
    content.vb: Public Class ColorTintFX Implements IPostProcessFilter
