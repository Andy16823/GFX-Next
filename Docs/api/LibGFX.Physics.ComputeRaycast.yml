    id: PerformRaycast
    path: ../LibGFX/Physics/ComputeRaycast.cs
    startLine: 103
  assemblies:
  - LibGFX
  namespace: LibGFX.Physics
  summary: >-
    Performs a raycast against the specified mesh using a compute shader and returns the result of the

    intersection, if any.
  remarks: >-
    This method uses GPU compute shaders to perform the raycast operation, which can
        efficiently handle complex meshes. The mesh's local transform is combined with the provided transform before
        testing. The result includes the hit position, normal, and triangle index if an intersection
        occurs.
  example: []
  syntax:
    content: public ComputeHitResult PerformRaycast(MeshRay ray, Transform transform, Mesh mesh)
    parameters:
    - id: ray
      type: LibGFX.Physics.MeshRay
      description: The ray, in world space, to test for intersection with the mesh.
    - id: transform
      type: LibGFX.Math.Transform
      description: >-
        The transformation to apply to the mesh before performing the raycast. Typically represents the mesh's world
            transform.
    - id: mesh
      type: LibGFX.Graphics.Mesh
      description: The mesh to test for intersection with the ray.
    return:
      type: LibGFX.Physics.ComputeHitResult
      description: >-
        A ComputeHitResult structure containing information about the intersection. If no intersection is found, the
            TriangleIndex property of the result is set to -1.
    content.vb: Public Function PerformRaycast(ray As MeshRay, transform As Transform, mesh As Mesh) As ComputeHitResult
  overload: LibGFX.Physics.ComputeRaycast.PerformRaycast*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: Thrown if the raycast system has not been initialized with a render device.
