    startLine: 153
  assemblies:
  - LibGFX
  namespace: LibGFX.Physics
  summary: >-
    Performs a raycast against the specified mesh using a compute shader and returns the result of the

    intersection, if any.
  remarks: >-
    This method uses GPU compute shaders to efficiently test for ray-mesh intersections.
        The mesh's local transform is combined with the provided world transform before the raycast. The caller is
        responsible for ensuring that the mesh and shader are compatible and properly initialized.
  example: []
  syntax:
    content: public static ComputeHitResult PerformRaycast(MeshRay ray, Transform transform, Mesh mesh, IRenderDevice renderer, ComputeShader shader)
    parameters:
    - id: ray
      type: LibGFX.Physics.MeshRay
      description: The ray, in world space, to test for intersection with the mesh.
    - id: transform
      type: LibGFX.Math.Transform
      description: The world transform to apply to the mesh before performing the raycast.
    - id: mesh
      type: LibGFX.Graphics.Mesh
      description: The mesh to test for intersection with the ray.
    - id: renderer
      type: LibGFX.Graphics.IRenderDevice
      description: The render device used to manage GPU resources and dispatch the compute shader.
    - id: shader
      type: LibGFX.Compute.ComputeShader
      description: The compute shader used to perform the ray-mesh intersection test.
    return:
      type: LibGFX.Physics.ComputeHitResult
      description: >-
        A ComputeHitResult structure containing information about the intersection. If no intersection is found, the
            TriangleIndex field will be -1.
    content.vb: Public Shared Function PerformRaycast(ray As MeshRay, transform As Transform, mesh As Mesh, renderer As IRenderDevice, shader As ComputeShader) As ComputeHitResult
  overload: LibGFX.Physics.ComputeRaycast.PerformRaycast*
